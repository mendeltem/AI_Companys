<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nvidia-Oekosystem &middot; Quartalszahlen und Bewertung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --grund:#E4E7EB; --flaeche:#FBFCFD; --flaeche2:#F1F3F6;
  --tinte:#0E1218; --gedaempft:#5A6472; --schwach:#8A94A2;
  --linie:#CBD2DA; --linie-stark:#A8B2BE;
  --akzent:#A81E62;
  --bin1:#0D6E68; --bin2:#4C8A8A; --bin3:#7C8494; --bin4:#96527C; --bin5:#A81E62;
  --neutral:#9AA3B0; --gut:#0D6E68; --schlecht:#A81E62;
  --disp:"IBM Plex Sans Condensed",'Arial Narrow',sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
/* IBM Plex Sans Condensed hat keine kyrillischen Schnitte. Im Mongolischen
   uebernimmt deshalb IBM Plex Sans die Anzeigerolle; die Schrift ist breiter,
   also wird die Laufweite etwas enger gestellt. */
html[lang="mn"]{--disp:"IBM Plex Sans",system-ui,sans-serif}
html[lang="mn"] .kopf h1{letter-spacing:-.028em;font-size:clamp(22px,3.6vw,36px)}
html[lang="mn"] .firmenkopf h2{letter-spacing:-.02em}
html[lang="mn"] .marke{letter-spacing:.07em}
html[lang="mn"] thead th{letter-spacing:.04em}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grund);color:var(--tinte);font-family:var(--body);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.huelle{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- Kopf ---------- */
.kopf{padding:34px 0 20px}
.kopf h1{font-family:var(--disp);font-weight:700;font-size:clamp(26px,4.4vw,44px);
         letter-spacing:-.02em;line-height:1.02;margin:0 0 10px;text-transform:uppercase}
.kopf h1 em{font-style:normal;color:var(--akzent)}
.kopf p{margin:0;max-width:64ch;color:var(--gedaempft);font-size:14.5px}
.stand{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
       color:var(--schwach);margin-bottom:12px}

/* ---------- Navigation ---------- */
.nav{position:sticky;top:0;z-index:30;background:var(--grund);
     border-bottom:1px solid var(--linie);margin-bottom:26px}
.nav-inner{max-width:1180px;margin:0 auto;padding:9px 20px;display:flex;gap:5px;
           overflow-x:auto;scrollbar-width:thin}
.chip{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;
      padding:5px 9px;border:1px solid var(--linie);background:var(--flaeche);color:var(--gedaempft);
      cursor:pointer;text-decoration:none;white-space:nowrap;border-radius:2px}
.chip:hover{border-color:var(--linie-stark);color:var(--tinte)}
.chip[aria-current="page"]{background:var(--tinte);color:var(--flaeche);border-color:var(--tinte)}
.chip:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
.sprachwahl{flex:0 0 auto;display:flex;gap:0;margin-right:9px;padding-right:9px;
            border-right:1px solid var(--linie)}
.chip.lang{border-radius:0;margin-left:-1px}
.chip.lang:first-child{border-radius:2px 0 0 2px;margin-left:0}
.chip.lang:last-child{border-radius:0 2px 2px 0}
.chip.lang[aria-current="true"]{background:var(--akzent);color:var(--flaeche);
                                border-color:var(--akzent);font-weight:600}

/* ---------- Bausteine ---------- */
.marke{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
       color:var(--schwach);display:block;margin-bottom:9px}
.abschnitt{margin-bottom:38px}
.abschnitt > h2{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.01em;
                margin:0 0 4px;text-transform:uppercase}
.abschnitt > .hinweis{margin:0 0 15px;color:var(--gedaempft);font-size:13.5px;max-width:72ch}

/* ---------- Bin-Karte ---------- */
.binkarte{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:3px;
          background:var(--linie);border:1px solid var(--linie);padding:3px}
.die{position:relative;background:var(--flaeche);padding:11px 11px 15px;cursor:pointer;
     text-decoration:none;color:inherit;display:block;transition:transform .12s ease}
.die:hover{transform:translateY(-2px);z-index:2;box-shadow:0 3px 12px rgba(14,18,24,.16)}
.die:focus-visible{outline:2px solid var(--akzent);outline-offset:-2px}
.die-tick{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em}
.die-wert{font-family:var(--disp);font-size:25px;font-weight:700;line-height:1;margin:9px 0 2px;
          letter-spacing:-.01em}
.die-sub{font-family:var(--mono);font-size:9.5px;color:var(--schwach);letter-spacing:.05em;
         text-transform:uppercase}
.die-bin{position:absolute;left:0;top:0;bottom:0;width:4px}
.die-kap{position:absolute;left:11px;right:11px;bottom:7px;height:2px;background:var(--linie)}
.die-kap i{display:block;height:100%;background:var(--gedaempft)}
.legende{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-family:var(--mono);
         font-size:10.5px;color:var(--gedaempft);align-items:center}
.legende span{display:flex;align-items:center;gap:5px}
.legende i{width:11px;height:11px;display:inline-block}

/* ---------- Tabellen ---------- */
.tabhuelle{overflow-x:auto;border:1px solid var(--linie);background:var(--flaeche)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--linie)}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
         color:var(--gedaempft);background:var(--flaeche2);position:sticky;top:0;
         border-bottom:1px solid var(--linie-stark);cursor:pointer;user-select:none}
thead th:hover{color:var(--tinte)}
thead th[aria-sort]{color:var(--akzent)}
tbody tr:hover{background:var(--flaeche2)}
tbody tr:last-child td{border-bottom:none}
td.z{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td a{color:inherit;text-decoration:none;font-weight:600;border-bottom:1px solid var(--linie-stark)}
td a:hover{color:var(--akzent);border-color:var(--akzent)}
.gut{color:var(--gut)} .schlecht{color:var(--schlecht)}
.balken{position:relative;display:block;height:14px;min-width:44px}
.balken i{position:absolute;left:0;top:2px;bottom:2px;background:var(--linie-stark);opacity:.55}
.balken span{position:relative;font-family:var(--mono);font-size:12px;padding-left:3px}

/* ---------- Kennzahlen ---------- */
.kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
            background:var(--linie);border:1px solid var(--linie)}
.kz{background:var(--flaeche);padding:12px 13px}
.kz b{display:block;font-family:var(--disp);font-size:24px;font-weight:700;line-height:1.1;
      letter-spacing:-.01em}
.kz small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
          text-transform:uppercase;color:var(--schwach);margin-bottom:5px}
.kz em{font-style:normal;font-size:11.5px;color:var(--gedaempft);font-family:var(--mono)}

/* ---------- Firmenkopf ---------- */
.firmenkopf{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px 15px;margin-bottom:5px}
.firmenkopf h2{font-family:var(--disp);font-weight:700;font-size:clamp(24px,3.6vw,36px);
               margin:0;letter-spacing:-.015em;text-transform:uppercase}
.firmenkopf .tick{font-family:var(--mono);font-size:12.5px;color:var(--flaeche);
                  background:var(--akzent);padding:3px 7px;letter-spacing:.05em}
.rolle{color:var(--gedaempft);font-size:14px;margin:0 0 17px}

/* ---------- Diagramme ---------- */
.chart{background:var(--flaeche);border:1px solid var(--linie);padding:13px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.schalter{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.schalter button{font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--linie);
                 background:var(--flaeche);color:var(--gedaempft);cursor:pointer;border-radius:2px}
.schalter button[aria-pressed="true"]{background:var(--tinte);color:var(--flaeche);border-color:var(--tinte)}
.schalter button:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.zwei{grid-template-columns:1fr}}

/* ---------- Fuss und Hinweise ---------- */
.warnung{border-left:3px solid var(--akzent);background:var(--flaeche);padding:11px 14px;
         font-size:13px;color:var(--gedaempft);margin-bottom:16px}
.warnung b{color:var(--tinte)}
.fuss{border-top:1px solid var(--linie);margin-top:44px;padding:22px 0 50px;
      font-size:12.5px;color:var(--gedaempft)}
.fuss h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
         color:var(--schwach);margin:0 0 8px}
.fuss p{margin:0 0 9px;max-width:80ch}
.fuss code{font-family:var(--mono);font-size:11.5px;background:var(--flaeche);padding:1px 4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

z":{"de":"Umsatz","en":"Revenue","mn":"Орлого"},"kz_kurs1j":{"de":"Kurs 1 Jahr","en":"Price 1 year","mn":"Ханш, 1 жил"},"an":{"de":"an","en":"on","mn":"дээр"},"bilanz_in":{"de":"Bilanz in","en":"reporting in","mn":"тайлангийн валют"},"m_kurs3j":{"de":"Kurs drei Jahre","en":"Price, three years","mn":"Ханш, гурван жил"},"m_kgvverlauf":{"de":"KGV Quartal × 4 im Verlauf","en":"P/E quarter × 4 over time","mn":"P/E, улирал × 4, хугацааны хөдөлгөөн"},"m_operativ":{"de":"Operatives Ergebnis je Quartal","en":"Operating profit per quarter","mn":"Улирлын үйл ажиллагааны ашиг"},"m_unterlinie":{"de":"Nettogewinn minus operatives Ergebnis","en":"Net profit minus operating profit","mn":"Цэвэр ашиг хасах үйл ажиллагааны ашиг"},"m_umsatzmarge":{"de":"Umsatz je Quartal","en":"Revenue per quarter","mn":"Улирлын орлого"},"m_marge_innen":{"de":"Zahl im Balken ist die operative Marge","en":"the figure inside the bar is the operating margin","mn":"баганан доторх тоо нь үйл ажиллагааны маржин"},"unterlinie_hint":{"de":"Alles unterhalb der operativen Linie: Beteiligungen, Derivate, Waehrungseffekte, Zinsen, Steuern, aufgegebene Geschaeftsbereiche. Grosse Ausschlaege heissen, dass das Ergebnis nicht aus dem laufenden Geschaeft kommt.","en":"Everything below the operating line: investments, derivatives, currency effects, interest, tax, discontinued operations. Large swings mean the result did not come from the operating business.","mn":"Үйл ажиллагааны шугамаас доош байгаа бүхэн: хөрөнгө оруулалт, деривати, ханшийн зөрүү, хүү, татвар, зогсоосон үйл ажиллагаа. Том хэлбэлзэл нь үр дүн нь үндсэн үйл ажиллагаанаас гараагүйг харуулна."},"keine_daten":{"de":"Keine Daten zum operativen Ergebnis.","en":"No operating profit data.","mn":"Үйл ажиллагааны ашгийн өгөгдөл байхгүй."},"zu_wenig":{"de":"Nicht genug Daten.","en":"Not enough data.","mn":"Өгөгдөл хангалтгүй."},"zu_wenig_kgv":{"de":"Zu wenige Quartale mit positivem Gewinn.","en":"Too few quarters with positive earnings.","mn":"Эерэг ашигтай улирал хэт цөөн."},"w_wenige_q":{"de":"Nur {n} Quartale verfuegbar.","en":"Only {n} quarters available.","mn":"Зөвхөн {n} улирлын өгөгдөл байна."},"w_crwv":{"de":"CoreWeave ist erst seit Maerz 2025 boersennotiert, mehr Quartale existieren nicht.","en":"CoreWeave has only been listed since March 2025, no more quarters exist.","mn":"CoreWeave 2025 оны 3-р сараас хойш бирж дээр бүртгэгдсэн тул илүү улирал байхгүй."},"w_kein_xbrl":{"de":"Diese Firma reicht kein Quartals-XBRL bei der SEC ein, daher reicht die Reihe nur so weit wie die verfuegbaren Berichte.","en":"This company files no quarterly XBRL with the SEC, so the series only reaches as far as the available reports.","mn":"Энэ компани SEC-д улирлын XBRL тайлан өгдөггүй тул цуваа нь зөвхөн боломжтой тайлангийн хэмжээгээр байна."},"w_kein_ttm":{"de":"Kein KGV ueber vier Quartale.","en":"No trailing four-quarter P/E.","mn":"Дөрвөн улирлын P/E тооцоолох боломжгүй."},"w_kein_ttm_t":{"de":"Die Summe der letzten vier Quartalsgewinne ist negativ oder unvollstaendig. Das KGV auf Basis des letzten Quartals mal vier steht daneben und ist hier die aussagekraeftigere Zahl.","en":"The sum of the last four quarterly earnings is negative or incomplete. The P/E based on the latest quarter times four sits next to it and is the more meaningful figure here.","mn":"Сүүлийн дөрвөн улирлын ашгийн нийлбэр сөрөг эсвэл дутуу байна. Сүүлийн улирлыг дөрөв дахин авсан P/E хажууд нь байгаа бөгөөд энд илүү утга учиртай."},"w_verlust":{"de":"Kein KGV berechenbar.","en":"No P/E can be calculated.","mn":"P/E тооцоолох боломжгүй."},"w_verlust_t":{"de":"Die Firma schreibt Verlust.","en":"The company is lossmaking.","mn":"Компани алдагдалтай ажиллаж байна."},"q_h2":{"de":"Die einzelnen Quartale","en":"The individual quarters","mn":"Улирал тус бүрээр"},"q_ende":{"de":"Quartal bis","en":"Quarter ended","mn":"Улирлын эцэс"},"q_umsatz":{"de":"Umsatz","en":"Revenue","mn":"Орлого"},"q_yoy":{"de":"J/J","en":"y/y","mn":"жилээр"},"q_brutto":{"de":"Bruttomarge","en":"Gross margin","mn":"Нийт ашгийн маржин"},"q_operativ":{"de":"Op.-Marge","en":"Op. margin","mn":"Үйл ажиллагааны маржин"},"q_netto":{"de":"Nettogewinn","en":"Net profit","mn":"Цэвэр ашиг"},"q_eps":{"de":"Gewinn/Aktie","en":"EPS","mn":"Нэгж хувьцаанд"},"q_kgv_damals":{"de":"KGV Q×4 damals","en":"P/E Q×4 then","mn":"Тухайн үеийн P/E, У×4"},"q_quelle":{"de":"Quelle","en":"Source","mn":"Эх сурвалж"},"q_hint":{"de":"Die letzte Spalte nennt die Quelle je Quartal. Die Spalte davor setzt den Kurs am Quartalsende ins Verhaeltnis zum Ergebnis dieses Quartals mal vier, zeigt also die Bewertung zum jeweiligen Zeitpunkt.","en":"The last column names the source for each quarter. The column before it relates the price at quarter end to that quarter's earnings times four, showing the valuation at the time.","mn":"Сүүлийн багана нь улирал бүрийн эх сурвалжийг заана. Түүний өмнөх багана нь улирлын эцсийн ханшийг тухайн улирлын ашгийг дөрөв дахин авсантай харьцуулж, тухайн үеийн үнэлгээг харуулна."},"q_stern":{"de":"Ein Stern am Gewinn je Aktie heisst: aus Nettogewinn und Aktienzahl gerechnet, nicht so berichtet.","en":"An asterisk on earnings per share means: computed from net profit and share count, not reported that way.","mn":"Нэгж хувьцааны ашиг дээрх од нь: цэвэр ашиг болон хувьцааны тооноос тооцоолсон, тайланд тэгж бичээгүй гэсэн үг."},"q_punkt":{"de":"markiert Quartale, in denen der Nettogewinn um mehr als die Haelfte vom operativen Ergebnis abweicht. Dann bestimmen betriebsfremde Posten das Ergebnis, und das KGV dieses Quartals sagt wenig ueber das laufende Geschaeft.","en":"marks quarters where net profit deviates from operating profit by more than half. Non-operating items then drive the result, and that quarter's P/E says little about the operating business.","mn":"цэвэр ашиг нь үйл ажиллагааны ашгаас тал хувиас илүү зөрсөн улирлыг тэмдэглэнэ. Ийм үед үндсэн бус зүйлс үр дүнг тодорхойлдог тул тухайн улирлын P/E үндсэн үйл ажиллагааны талаар бага зүйл хэлнэ."},"q_titel_auff":{"de":"Nettogewinn weicht stark vom operativen Ergebnis ab","en":"net profit deviates sharply from operating profit","mn":"цэвэр ашиг үйл ажиллагааны ашгаас ихээхэн зөрж байна"},"f_h3":{"de":"Woher die Zahlen stammen","en":"Where the numbers come from","mn":"Тоонууд хаанаас гарсан бэ"},"f_kurse_b":{"de":"Kurse","en":"Prices","mn":"Ханш"},"f_kurse":{"de":"aus yfinance, Tagesschlusskurse der letzten drei Jahre, jeweils von der Heimatboerse. TSMC laeuft ueber 2330.TW statt ueber das ADR, Sony ueber 6758.T. Sonst staende der Kurs in USD, der Gewinn je Aktie aber in TWD oder JPY, und jedes daraus gerechnete KGV waere falsch.","en":"from yfinance, daily closes of the last three years, each from the home exchange. TSMC runs on 2330.TW rather than the ADR, Sony on 6758.T. Otherwise the price would be in USD but earnings per share in TWD or JPY, and any P/E built from that would be wrong.","mn":"yfinance-ээс авсан, сүүлийн гурван жилийн өдрийн хаалтын ханш, тус бүр эх орныхоо биржээс. TSMC-г ADR-ын оронд 2330.TW, Sony-г 6758.T дээр авсан. Эс тэгвээс ханш нь ам.доллараар, нэгж хувьцааны ашиг нь TWD эсвэл JPY-ээр гарч, түүнээс тооцсон P/E буруу болно."},"f_quartale_b":{"de":"Quartalszahlen","en":"Quarterly figures","mn":"Улирлын тоо"},"f_quartale":{"de":"aus drei Quellen, je Quartal ausgewiesen: SEC-XBRL, direkt aus den Einreichungen; yfinance; und fuer TSMC, Samsung und SK hynix aus den Original-Pressemitteilungen beziehungsweise Ergebnispraesentationen.","en":"from three sources, labelled per quarter: SEC XBRL, straight from the filings; yfinance; and for TSMC, Samsung and SK hynix from the original press releases and earnings presentations.","mn":"гурван эх сурвалжаас, улирал бүрээр тэмдэглэсэн: SEC-XBRL буюу шууд тайлангаас; yfinance; мөн TSMC, Samsung, SK hynix-ийн хувьд эх хувийн хэвлэлийн мэдэгдэл болон үр дүнгийн танилцуулгаас."},"f_grenzen_b":{"de":"Bekannte Grenzen.","en":"Known limits.","mn":"Мэдэгдэж буй хязгаарлалт."},"f_grenzen":{"de":"Fuer Sony liegen nur fuenf Quartale vor, weil dort kein Quartals-XBRL bei der SEC eingereicht wird. Bei Samsung und SK hynix stammen Umsatz und Gewinn aus den Ergebnispraesentationen und wurden ueber mehrere Ausgaben gegengeprueft; der Gewinn je Aktie ist dort aus Gewinn und Aktienzahl gerechnet. Quartale, die als vierte Quartale aus Jahr minus Neunmonatszeitraum rekonstruiert wurden, sind bei Umsatz und Gewinn exakt, beim Gewinn je Aktie eine Naeherung.","en":"Only five quarters exist for Sony because no quarterly XBRL is filed with the SEC. For Samsung and SK hynix, revenue and profit come from the earnings presentations and were cross-checked across several editions; earnings per share there is computed from profit and share count. Quarters reconstructed as fourth quarters from full year minus nine months are exact for revenue and profit but an approximation for earnings per share.","mn":"Sony-гийн хувьд зөвхөн таван улирал байгаа нь SEC-д улирлын XBRL тайлан өгдөггүйтэй холбоотой. Samsung болон SK hynix-ийн орлого, ашиг нь үр дүнгийн танилцуулгаас гарсан бөгөөд хэд хэдэн хувилбараар нь тулгаж шалгасан; нэгж хувьцааны ашгийг ашиг ба хувьцааны тооноос тооцсон. Жилийн дүнгээс есөн сарын дүнг хассанаар сэргээсэн дөрөвдүгээр улирлууд нь орлого, ашгийн хувьд оновчтой боловч нэгж хувьцааны ашгийн хувьд ойролцоо утга юм."},"f_waehrung_b":{"de":"Waehrungen.","en":"Currencies.","mn":"Валют."},"f_waehrung":{"de":"KGV, Margen und Wachstumsraten sind Verhaeltniszahlen und damit waehrungsunabhaengig vergleichbar. Marktkapitalisierung und Umsatz werden fuer den Vergleich zu Tageskursen in USD umgerechnet; auf der Firmenseite stehen sie in der Heimatwaehrung.","en":"P/E, margins and growth rates are ratios and therefore comparable regardless of currency. Market capitalisation and revenue are converted to USD at current rates for the comparison; on the company page they stay in the home currency.","mn":"P/E, маржин, өсөлтийн хувь нь харьцаа тул валютаас үл хамааран харьцуулагдана. Зах зээлийн үнэлгээ болон орлогыг харьцуулахын тулд өнөөдрийн ханшаар ам.доллар руу хөрвүүлсэн; компанийн хуудсан дээр эх орны валютаар байна."},"f_disclaimer":{"de":"Keine Anlageberatung. Zahlen koennen Extraktionsfehler enthalten; die Filing-Quelle steht in jeder Quartalszeile.","en":"Not investment advice. Figures may contain extraction errors; the filing source is given in every quarterly row.","mn":"Хөрөнгө оруулалтын зөвлөгөө биш. Тоонд задлан авахад гарсан алдаа байж болно; эх тайлангийн сурвалжийг улирал бүрийн мөрөнд заасан."},"seg_h2":{"de":"Was genau waechst","en":"What exactly is growing","mn":"Яг юу өсөж байна вэ"},"seg_hint":{"de":"Umsatz aufgeteilt nach dem, was die Firma selbst als Segment berichtet. Der Gesamtumsatz verdeckt oft das Gegenteil dessen, was im Inneren passiert.","en":"Revenue split the way the company itself reports its segments. The total often hides the opposite of what is happening inside.","mn":"Компани өөрөө тайлагнадаг сегментээр нь хуваасан орлого. Нийт дүн нь дотор нь юу болж байгаагийн эсрэгийг харуулж мэднэ."},"seg_sparten":{"de":"Sparten","en":"Segments","mn":"Салбар"},"seg_produkte":{"de":"Produkte","en":"Products","mn":"Бүтээгдэхүүн"},"seg_regionen":{"de":"Regionen","en":"Regions","mn":"Бүс нутаг"},"seg_op":{"de":"Operatives Ergebnis je Sparte","en":"Operating profit by segment","mn":"Салбар тус бүрийн үйл ажиллагааны ашиг"},"seg_anteil":{"de":"Anteil","en":"Share","mn":"Эзлэх хувь"},"seg_op_kurz":{"de":"Op.-Ergebnis","en":"Op. profit","mn":"Үйл ажиллагааны ашиг"},"seg_marge":{"de":"Op.-Marge","en":"Op. margin","mn":"Үйл ажиллагааны маржин"},"seg_wert":{"de":"Wert","en":"Value","mn":"Дүн"},"seg_kein_netto":{"de":"Nettogewinn je Segment gibt es nicht, und zwar in keiner Einreichung. Geprueft ueber acht Firmen: Umsatz und operatives Ergebnis tragen eine Segmentdimension, Nettogewinn, Steuern und Zinsen bei keiner einzigen. Der Rechnungslegungsstandard verlangt nur die Groesse, die die Konzernleitung tatsaechlich je Segment steuert, und das ist das operative Ergebnis. Zinsen, Steuern und Beteiligungsergebnisse werden auf Konzernebene gefuehrt. Das ist dieselbe Grenze wie im Diagramm oben: was zwischen operativem Ergebnis und Nettogewinn liegt, laesst sich keinem Segment zuordnen.","en":"Net profit by segment does not exist in any filing. Checked across eight companies: revenue and operating profit carry a segment dimension, net profit, tax and interest carry none. The accounting standard only requires the measure that management actually steers per segment, and that is operating profit. Interest, tax and investment results are handled at group level. This is the same boundary as the chart above: whatever sits between operating profit and net profit cannot be assigned to a segment.","mn":"Сегмент тус бүрийн цэвэр ашиг ямар ч тайланд байдаггүй. Найман компанийг шалгасан: орлого болон үйл ажиллагааны ашиг сегментийн хэмжээстэй, харин цэвэр ашиг, татвар, хүү нэг нь ч биш. Нягтлан бодох бүртгэлийн стандарт нь удирдлага сегмент тус бүрээр бодитоор удирддаг үзүүлэлтийг л шаарддаг бөгөөд энэ нь үйл ажиллагааны ашиг юм. Хүү, татвар, хөрөнгө оруулалтын үр дүнг группын түвшинд хөтөлдөг. Энэ нь дээрх графиктай ижил хил хязгаар: үйл ажиллагааны ашиг ба цэвэр ашгийн хооронд байгаа зүйлийг ямар ч сегментэд хамааруулах боломжгүй."},"seg_keine":{"de":"Keine Segmentzahlen verfuegbar.","en":"No segment figures available.","mn":"Сегментийн тоо байхгүй."},"seg_samsung":{"de":"Samsungs Segmenttabelle liegt in den Praesentationen als Grafik vor. Der Textinhalt laesst sich nicht verlaesslich den Zeilen zuordnen, deshalb werden hier keine Segmentzahlen gezeigt statt womoeglich falscher.","en":"Samsung's segment table sits in the presentations as a graphic. Its text layer cannot be reliably matched to the rows, so no segment figures are shown here rather than possibly wrong ones.","mn":"Samsung-ийн сегментийн хүснэгт танилцуулгад зураг хэлбэрээр байдаг. Түүний текстийг мөрүүдтэй нь найдвартай тааруулах боломжгүй тул буруу тоо харуу <script>
const D = JSON.parse(document.getElementById('daten').textContent);
const TX = JSON.parse(document.getElementById('texte').textContent);
const SEG = JSON.parse(document.getElementById('segmente').textContent);
/* Dieselbe Sparte taucht ueber die Einreichungen hinweg mit und ohne den Zusatz
   "Segment" auf, etwa Nvidias "Compute And Networking" und "Compute And
   Networking Segment". Ohne Zusammenfuehrung stuende sie zweimal in der Tabelle. */
for(const firma of Object.values(SEG)){
  for(const gruppe of ['sparten','produkte','regionen','op_sparten']){
    if(!firma[gruppe]) continue;
    const zusammen={};
    for(const [name, werte] of Object.entries(firma[gruppe])){
      const rein=name.replace(/ Segment$/,'').trim();
      zusammen[rein]=Object.assign(zusammen[rein]||{}, werte);
    }
    firma[gruppe]=zusammen;
  }
}
const F = D.firmen, K = D.kurse;
const SCHLUESSEL = Object.keys(F);

/* ---------- Sprache ---------- */
let L = 'de';
const T = (k)=> (TX.t[k] && TX.t[k][L]) || (TX.t[k] && TX.t[k].de) || k;
const rolleT = (r)=> (TX.rollen[r] && TX.rollen[r][L]) || r;

/* ---------- Formatierung ---------- */
const nf = (v,n=1)=> v==null||!isFinite(v) ? '–' :
  v.toLocaleString(TX.locale[L],{minimumFractionDigits:n,maximumFractionDigits:n});
const pf = (v,n=1)=> v==null||!isFinite(v) ? '–' : (v>0?'+':'')+nf(v,n)+' %';
function gross(v, whg){
  if(v==null||!isFinite(v)) return '–';
  const a=Math.abs(v);
  if(a>=1e12) return nf(v/1e12,2)+' '+T('e_bio')+' '+whg;
  if(a>=1e9)  return nf(v/1e9,1)+' '+T('e_mrd')+' '+whg;
  if(a>=1e6)  return nf(v/1e6,0)+' '+T('e_mio')+' '+whg;
  return nf(v,0)+' '+whg;
}
const kursF = (v,whg)=> whg==='KRW'||whg==='JPY' ? nf(v,0)+' '+whg : nf(v,2)+' '+whg;

/* ---------- Bewertungsklassen, wie Bins auf einer Wafer-Karte ---------- */
const GRENZEN = [12, 20, 32, 60];           // KGV-Schwellen zwischen den Klassen
const BINFARBE = ['var(--bin1)','var(--bin2)','var(--bin3)','var(--bin4)','var(--bin5)'];
const binname = ()=>[T('bin_unter')+' 12', '12 '+T('bin_bis')+' 20', '20 '+T('bin_bis')+' 32',
                     '32 '+T('bin_bis')+' 60', T('bin_ueber')+' 60'];
function bin(kgv){
  if(kgv==null||!isFinite(kgv)||kgv<=0) return -1;
  let i=0; while(i<GRENZEN.length && kgv>=GRENZEN[i]) i++;
  return i;
}
const binfarbe = k => { const b=bin(k); return b<0 ? 'var(--neutral)' : BINFARBE[b]; };

/* ---------- KGV-Verlauf: Kurs am Quartalsende gegen Quartalsgewinn mal vier ---------- */
function kursAm(key, datum){
  const kd=K[key].datum, kc=K[key].close;
  for(let i=kd.length-1;i>=0;i--) if(kd[i]<=datum) return kc[i];
  return null;
}
function kgvVerlauf(key){
  const punkte=[];
  for(const q of F[key].quartale){
    if(q.eps==null||q.eps<=0) continue;
    const p=kursAm(key,q.ende);
    if(p) punkte.push({datum:q.ende, kgv:p/(q.eps*4)});
  }
  return punkte.reverse();
}

/* ---------- SVG-Grundbausteine ---------- */
function skala(werte){
  const gueltig=werte.filter(v=>v!=null&&isFinite(v));
  let lo=Math.min(...gueltig), hi=Math.max(...gueltig);
  if(lo===hi){lo-=1;hi+=1}
  const luft=(hi-lo)*0.08; return [lo-luft, hi+luft];
}
function achsenTicks(lo,hi,n=4){
  const t=[]; for(let i=0;i<=n;i++) t.push(lo+(hi-lo)*i/n); return t;
}
function linie(punkte, opt){
  const {breite=640, hoehe=210, farbe='var(--akzent)', flaeche=false,
         labelY=v=>nf(v,0), stufen=null} = opt||{};
  const ml=52, mr=10, mo=10, mu=22;
  const iw=breite-ml-mr, ih=hoehe-mo-mu;
  const ys=punkte.map(p=>p.y);
  const [lo,hi]=skala(ys);
  const X=i=>ml+(punkte.length<2?iw/2:iw*i/(punkte.length-1));
  const Y=v=>mo+ih-(v-lo)/(hi-lo)*ih;
  let d=''; punkte.forEach((p,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)+' '});
  let s=`<svg viewBox="0 0 ${breite} ${hoehe}" role="img">`;
  for(const t of achsenTicks(lo,hi)){
    s+=`<line x1="${ml}" x2="${breite-mr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"
         stroke="var(--linie)" stroke-width="1"/>`;
    s+=`<text x="${ml-7}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end"
         font-family="var(--mono)" font-size="10" fill="var(--schwach)">${labelY(t)}</text>`;
  }
  if(stufen) for(const st of stufen){
    const i=punkte.findIndex(p=>p.x>=st);
    if(i>0) s+=`<line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${mo}" y2="${mo+ih}"
                 stroke="var(--linie-stark)" stroke-width="1" stroke-dasharray="2 3"/>`;
  }
  if(flaeche && punkte.length>1)
    s+=`<path d="${d}L${X(punkte.length-1).toFixed(1)} ${mo+ih}L${X(0).toFixed(1)} ${mo+ih}Z"
         fill="${farbe}" opacity=".08"/>`;
  s+=`<path d="${d}" fill="none" stroke="${farbe}" stroke-width="1.8"
       stroke-linejoin="round" stroke-linecap="round"/>`;
  const n=punkte.length;
  [0, Math.floor(n/2), n-1].forEach(i=>{
    if(!punkte[i]) return;
    s+=`<text x="${X(i).toFixed(1)}" y="${hoehe-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}"
         font-family="var(--mono)" font-size="10" fill="var(--schwach)">${punkte[i].x.slice(0,7)}</text>`;
  });
  return s+'</svg>';
}
function saeulen(punkte, opt){
  const {breite=680, hoehe=250, labelY=v=>nf(v,0), zeigeWert=true,
         posFarbe='var(--bin1)', negFarbe='var(--bin5)'} = opt||{};
  const ml=56, mr=10, mo=26, mu=24;
  const iw=breite-ml-mr, ih=hoehe-mo-mu;
  const werte=punkte.map(p=>p.y);
  const hi=Math.max(0,...werte), lo=Math.min(0,...werte);
  const spanne=(hi-lo)||1;
  const Y=v=>mo+ih-(v-lo)/spanne*ih;
  const bw=Math.min(iw/punkte.length*0.62, 34);
  let s=`<svg viewBox="0 0 ${breite} ${hoehe}" role="img">`;
  for(const t of achsenTicks(lo,hi)){
    s+=`<line x1="${ml}" x2="${breite-mr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"
         stroke="var(--linie)"/>
        <text x="${ml-7}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end" font-family="var(--mono)"
         font-size="10" fill="var(--schwach)">${labelY(t)}</text>`;
  }
  s+=`<line x1="${ml}" x2="${breite-mr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"
       stroke="var(--linie-stark)" stroke-width="1.2"/>`;
  punkte.forEach((p,i)=>{
    const cx=ml+iw*(i+0.5)/punkte.length;
    const oben=Math.min(Y(p.y),Y(0)), h=Math.max(Math.abs(Y(p.y)-Y(0)),1.2);
    const farbe=p.y>=0?posFarbe:negFarbe;
    s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${oben.toFixed(1)}" width="${bw.toFixed(1)}"
         height="${h.toFixed(1)}" fill="${farbe}" opacity=".88"><title>${p.x}: ${labelY(p.y)}</title></rect>`;
    if(zeigeWert && punkte.length<=22)
      s+=`<text x="${cx.toFixed(1)}" y="${(p.y>=0?oben-4:oben+h+10).toFixed(1)}" text-anchor="middle"
           font-family="var(--mono)" font-size="9" font-weight="600"
           fill="${farbe}">${labelY(p.y)}</text>`;
    if(p.innen!=null && h>15)
      s+=`<text x="${cx.toFixed(1)}" y="${(oben+h/2+3.5).toFixed(1)}" text-anchor="middle"
           font-family="var(--mono)" font-size="9" font-weight="600" fill="var(--flaeche)">${p.innen}</text>`;
    const schritt=Math.ceil(punkte.length/8);
    if(i%schritt===0 || i===punkte.length-1)
      s+=`<text x="${cx.toFixed(1)}" y="${hoehe-6}" text-anchor="middle" font-family="var(--mono)"
           font-size="9.5" fill="var(--schwach)">${p.x.slice(2,7)}</text>`;
  });
  return s+'</svg>';
}

/* ---------- gestapelte Balken fuer Segmente ---------- */
const SEGFARBEN=['var(--akzent)','var(--bin1)','var(--bin3)','#5B3FA8','#B07414','#2C6E9E',
                 '#8A9A2B','#A8425E','#3E7C8C','#7A5C3E','#586A8C','#9C6B2F','#4C7A55',
                 '#8C4A7A','#6B7A3E'];
function gestapelt(quartale, reihen, opt){
  const {breite=680, hoehe=300, labelY=v=>nf(v,0)} = opt||{};
  const ml=58, mr=10, mo=14, mu=24;
  const iw=breite-ml-mr, ih=hoehe-mo-mu;
  // Negative Beitraege wie Metas Reality Labs werden nach unten gestapelt,
  // sonst wuerde der Balken sie stillschweigend gegen die positiven aufrechnen.
  const posS=quartale.map(q=>reihen.reduce((a,r)=>a+Math.max(r.werte[q]||0,0),0));
  const negS=quartale.map(q=>reihen.reduce((a,r)=>a+Math.min(r.werte[q]||0,0),0));
  const hi=Math.max(...posS,0)||1, lo=Math.min(...negS,0);
  const Y=v=>mo+ih-(v-lo)/(hi-lo)*ih;
  const bw=Math.min(iw/quartale.length*0.66, 38);
  let s=`<svg viewBox="0 0 ${breite} ${hoehe}" role="img">`;
  for(const t of achsenTicks(lo,hi)){
    s+=`<line x1="${ml}" x2="${breite-mr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"
         stroke="var(--linie)"/>
        <text x="${ml-7}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end" font-family="var(--mono)"
         font-size="10" fill="var(--schwach)">${labelY(t)}</text>`;
  }
  if(lo<0) s+=`<line x1="${ml}" x2="${breite-mr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"
                stroke="var(--linie-stark)" stroke-width="1.2"/>`;
  quartale.forEach((q,i)=>{
    const cx=ml+iw*(i+0.5)/quartale.length;
    let obenAuf=0, untenAb=0;
    reihen.forEach((r,ri)=>{
      const v=r.werte[q]||0;
      if(!v) return;
      let y1,h;
      if(v>0){ y1=Y(obenAuf+v); h=Y(obenAuf)-Y(obenAuf+v); obenAuf+=v; }
      else   { y1=Y(untenAb);   h=Y(untenAb+v)-Y(untenAb);  untenAb+=v; }
      s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}"
           height="${Math.max(h,0.6).toFixed(1)}" fill="${SEGFARBEN[ri%SEGFARBEN.length]}"
           opacity=".9"><title>${q} · ${r.name}: ${labelY(v)}</title></rect>`;
    });
    const schritt=Math.ceil(quartale.length/8);
    if(i%schritt===0||i===quartale.length-1)
      s+=`<text x="${cx.toFixed(1)}" y="${hoehe-6}" text-anchor="middle" font-family="var(--mono)"
           font-size="9.5" fill="var(--schwach)">${q.slice(2,7)}</text>`;
  });
  return s+'</svg>';
}

function zeichneTabelle(){
  const zeilen=SCHLUESSEL.map(k=>({...F[k],__k:k}));
  const SP=spalten();
  const sp=SP.find(s=>s[0]===sortSpalte)||SP[3];
  zeilen.sort((a,b)=>{
    const va=sp[3](a), vb=sp[3](b);
    if(va==null) return 1; if(vb==null) return -1;
    if(typeof va==='string') return sortAb ? vb.localeCompare(va) : va.localeCompare(vb);
    return sortAb ? vb-va : va-vb;
  });
  let h='<table><thead><tr>';
  for(const s of SP)
    h+=`<th data-sp="${s[0]}" ${s[0]===sortSpalte?`aria-sort="${sortAb?'descending':'ascending'}"`:''}>${s[1]}</th>`;
  h+='</tr></thead><tbody>';
  for(const z of zeilen){
    h+='<tr>';
    SP.forEach((s,i)=>{h+=`<td class="${i>1?'z':''}">${s[2](z)}</td>`});
    h+='</tr>';
  }
  document.getElementById('tabelle').innerHTML=h+'</tbody></table>';
  document.querySelectorAll('#tabelle th').forEach(th=>{
    th.onclick=()=>{
      const s=th.dataset.sp;
      if(s===sortSpalte) sortAb=!sortAb; else {sortSpalte=s; sortAb=true}
      zeichneTabelle();
    };
  });
}

/* ---------- Segmente ---------- */
let segSchnitt = 'auto';
function segmentteil(k, w, teiler, eName){
  const d = SEG[k];
  if(!d) return '';
  const schnitte = [['sparten', T('seg_sparten')], ['produkte', T('seg_produkte')],
                    ['regionen', T('seg_regionen')], ['op_sparten', T('seg_op_kurz')]]
                   .filter(([g])=>d[g] && Object.keys(d[g]).length);
  if(!schnitte.length){
    const grund = k==='SAMSUNG' ? T('seg_samsung') : T('seg_keine');
    return `<div class="abschnitt"><h2>${T('seg_h2')}</h2>
            <div class="warnung">${grund}</div></div>`;
  }
  const aktiv = schnitte.find(([g])=>g===segSchnitt) ? segSchnitt : schnitte[0][0];
  const reihen = Object.entries(d[aktiv])
    .map(([name, werte])=>({name, werte:Object.fromEntries(
       Object.entries(werte).map(([e,v])=>[e, v/teiler]))}))
    .sort((a,b)=>{const q=Object.keys(b.werte).sort().pop();
                  return (b.werte[q]||0)-(a.werte[q]||0);});
  if(!reihen.length) return '';
  const quartale = [...new Set(reihen.flatMap(r=>Object.keys(r.werte)))].sort();
  const letzte = quartale[quartale.length-1];
  const vorjahr = quartale.find(q=>Math.abs(new Date(q)-new Date(letzte))/864e5 > 330 &&
                                   Math.abs(new Date(q)-new Date(letzte))/864e5 < 400);
  const summe = reihen.reduce((a,r)=>a+(r.werte[letzte]||0),0);

  let schalter='<div class="schalter">';
  for(const [g,label] of schnitte)
    schalter+=`<button data-seg="${g}" aria-pressed="${g===aktiv}">${label}</button>`;
  schalter+='</div>';

  let leg='<div class="legende">';
  reihen.forEach((r,i)=>{leg+=`<span><i style="background:${SEGFARBEN[i%SEGFARBEN.length]}"></i>${r.name}</span>`});
  leg+='</div>';

  // Bei der Ergebnisansicht ersetzt die Segmentmarge die Anteilsspalte:
  // ein Anteil am Gesamtergebnis ist wenig aussagekraeftig, sobald ein
  // Segment negativ ist.
  const istOp = aktiv==='op_sparten';
  const umsatzQuelle = d.sparten && Object.keys(d.sparten).length ? d.sparten : null;
  let tab=`<div class="tabhuelle" style="margin-top:14px"><table><thead><tr>
     <th>${istOp?T('seg_sparten'):T('seg_sparten')}</th><th>${letzte}</th>
     <th>${istOp?T('seg_marge'):T('seg_anteil')}</th><th>${T('q_yoy')}</th>
     </tr></thead><tbody>`;
  for(const [i,r] of reihen.entries()){
    const v=r.werte[letzte], vj=vorjahr?r.werte[vorjahr]:null;
    const yoy=(v!=null&&vj&&vj>0)?(v/vj-1)*100:null;
    let dritte='–';
    if(istOp && umsatzQuelle && umsatzQuelle[r.name] && umsatzQuelle[r.name][letzte])
      dritte = nf(v*teiler/umsatzQuelle[r.name][letzte]*100,1)+' %';
    else if(!istOp && v!=null && summe)
      dritte = nf(v/summe*100,1)+' %';
    tab+=`<tr><td><i style="display:inline-block;width:9px;height:9px;margin-right:7px;
            background:${SEGFARBEN[i%SEGFARBEN.length]}"></i>${r.name}</td>
          <td class="z">${v==null?'–':nf(v, Math.abs(v)>=100?0:1)+' '+eName}</td>
          <td class="z">${dritte}</td>
          <td class="z ${yoy>0?'gut':yoy<0?'schlecht':''}">${pf(yoy)}</td></tr>`;
  }
  tab+='</tbody></table></div>';

  const warn = (k==='TSM' ? `<div class="warnung">${T('seg_tsm')}</div>` : '')
             + (aktiv==='op_sparten' ? `<div class="warnung">${T('seg_kein_netto')}</div>` : '');
  return `<div class="abschnitt">
    <h2>${T('seg_h2')}</h2>
    <p class="hinweis">${T('seg_hint')}</p>
    ${warn}${schalter}
    <div class="chart">${gestapelt(quartale, reihen, {labelY:v=>nf(v,Math.abs(v)>=100?0:1)})}</div>
    ${leg}${tab}</div>`;
}

  let tab=`<div class="tabhuelle"><table><thead><tr>

      <td class="z">${x.operativmarge==null?'–':nf(x.operativmarge,1)+' %'}</td>
      <td class="z" ${auff?`title="${T('q_titel_auff')}"`:''}>${gross(x.netto,w)}${auff?' <b style="color:var(--akzent)">&#9679;</b>':''}</td>
      <td class="z">${x.eps==null?'–':nf(x.eps, Math.abs(x.eps)>500?0:2)}${x.eps_berechnet?' <span style="color:var(--schwach)">*</span>':''}</td>
      <td class="z" style="color:${binfarbe(kgvD)}">${nf(kgvD,1)}</td>
      <td style="text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--schwach)">${x.quelle}</td>
    </tr>`;
  }
  tab+='</tbody></table></div>';

  const aufw=[...q].reverse();
  const einheit = (w==='KRW'||w==='JPY') ? 1e12 : 1e9;
  const eName   = ((w==='KRW'||w==='JPY') ? T('e_bio') : T('e_mrd'))+' '+w;
  const opReihe = aufw.filter(x=>x.operativ!=null).map(x=>({x:x.ende, y:x.operativ/einheit}));
  const utlReihe= aufw.filter(x=>x.netto!=null&&x.operativ!=null)
                      .map(x=>({x:x.ende, y:(x.netto-x.operativ)/einheit}));
  const umsReihe= aufw.filter(x=>x.umsatz).map(x=>({x:x.ende, y:x.umsatz/einheit,
                      innen: x.operativmarge==null?null:Math.round(x.operativmarge)+'%'}));

  const diagramme = `
  <div class="abschnitt zwei">
    <div>
      <span class="marke">${T('m_operativ')} &middot; ${eName}</span>
      <div class="chart">${opReihe.length
        ? saeulen(opReihe,{labelY:v=>nf(v,Math.abs(v)>=100?0:1)})
        : `<p style="color:var(--schwach);font-size:13px;margin:0">${T('keine_daten')}</p>`}</div>
    </div>
    <div>
      <span class="marke">${T('m_unterlinie')} &middot; ${eName}</span>
      <div class="chart">${utlReihe.length
        ? saeulen(utlReihe,{labelY:v=>nf(v,Math.abs(v)>=100?0:1)})
        : `<p style="color:var(--schwach);font-size:13px;margin:0">${T('zu_wenig')}</p>`}</div>
      <p class="hinweis" style="margin-top:8px">${T('unterlinie_hint')}</p>
    </div>
  </div>

  <div class="abschnitt">
    <span class="marke">${T('m_umsatzmarge')} &middot; ${eName} &middot; ${T('m_marge_innen')}</span>
    <div class="chart">${umsReihe.length
      ? saeulen(umsReihe,{hoehe:270, labelY:v=>nf(v,Math.abs(v)>=100?0:1), posFarbe:'var(--tinte)'})
      : ''}</div>
  </div>`;

  return `
  <div class="kopf" style="padding-bottom:6px">
    <div class="firmenkopf">
      <span class="tick">${k}</span><h2>${e.name}</h2>
    </div>
    <p class="rolle">${rolleT(e.rolle)} &middot; ${e.symbol} ${T('an')} ${e.boerse}
       &middot; ${T('bilanz_in')} ${w}${e.cik?` &middot; SEC-CIK ${e.cik}`:''}</p>
  </div>
  ${warn}
  <div class="abschnitt"><div class="kennzahlen">${kzh}</div></div>

  <div class="abschnitt zwei">
    <div>
      <span class="marke">${T('m_kurs3j')} &middot; ${w}</span>
      <div class="chart">${linie(dünn,{farbe:'var(--tinte)',flaeche:true,
        labelY:v=>w==='KRW'||w==='JPY'?nf(v/1000,0)+'k':nf(v,0)})}</div>
    </div>
    <div>
      <span class="marke">${T('m_kgvverlauf')}</span>
      <div class="chart">${kv.length>1
        ? linie(kv.map(p=>({x:p.datum,y:p.kgv})),{farbe:'var(--akzent)',labelY:v=>nf(v,0)})
        : `<p style="color:var(--schwach);font-size:13px;margin:0">${T('zu_wenig_kgv')}</p>`}</div>
    </div>
  </div>

  ${diagramme}
  ${segmentteil(k, w, einheit, eName)}

  <div class="abschnitt">
    <h2>${T('q_h2')}</h2>
    <p class="hinweis">${T('q_hint')}
       ${q.some(x=>x.eps_berechnet)?' '+T('q_stern'):''}
       ${sonder?` <b style="color:var(--akzent)">&#9679;</b> ${T('q_punkt')}`:''}</p>
    ${tab}
  </div>`;
}

/* ---------- Navigation, Sprache, Routing ---------- */
function baueNav(aktiv){
  let h='<span class="sprachwahl">';
  for(const sp of TX.sprachen)
    h+=`<a class="chip lang" href="#/${sp}/${aktiv||''}" ${sp===L?'aria-current="true"':''}
        lang="${sp}">${TX.t.sprache[sp]}</a>`;
  h+='</span>';
  h+=`<a class="chip" href="#/${L}/">&#9632; ${T('uebersicht')}</a>`;
  const sortiert=[...SCHLUESSEL].sort((a,b)=>(F[b].marktkap_usd||0)-(F[a].marktkap_usd||0));
  for(const k of sortiert) h+=`<a class="chip" href="#/${L}/${k}">${k}</a>`;
  document.getElementById('nav').innerHTML=h;
  document.querySelectorAll('#nav .chip:not(.lang)').forEach(c=>{
    const ziel=c.getAttribute('href').split('/')[2]||'';
    if(ziel===(aktiv||'')) c.setAttribute('aria-current','page');
  });
}
function baueFuss(){
  document.getElementById('fuss').innerHTML=`
    <h3>${T('f_h3')}</h3>
    <p><b>${T('f_kurse_b')}</b> ${T('f_kurse')}</p>
    <p><b>${T('f_quartale_b')}</b> ${T('f_quartale')}</p>
    <p><b>${T('f_grenzen_b')}</b> ${T('f_grenzen')}</p>
    <p><b>${T('f_waehrung_b')}</b> ${T('f_waehrung')}</p>
    <p style="color:var(--schwach)">${T('f_disclaimer')}</p>`;
}
function route(){
  const teile=(location.hash||'#/de/').slice(2).split('/');
  L = TX.sprachen.includes(teile[0]) ? teile[0] : 'de';
  const firma = teile[1] || '';
  document.documentElement.lang = L;
  const app=document.getElementById('app');
  baueNav(F[firma] ? firma : '');
  baueFuss();
  if(firma && F[firma]){
    app.innerHTML=firmenseite(firma);
    document.querySelectorAll('[data-seg]').forEach(b=>{
      b.onclick=()=>{ segSchnitt=b.dataset.seg; route(); };
    });
    document.title=`${firma} · ${F[firma].name} · ${T('titel')}`;
  }else{
    app.innerHTML=uebersicht();
    zeichneTabelle(); zeichneStreu(); zeichneVergleich();
    document.title=T('titel');
  }
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
route();
</script>
